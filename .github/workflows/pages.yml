name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - web/src/**
      - web/test/**
      - web/server.js
      - web/lib/**
      - web/import-roster.js
      - web/package.json
      - web/package-lock.json
      - mysql/init/init.sql
      - deploy/worker.mjs
      - deploy/worker.test.mjs
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API origin (optional if ASSIGNMENT_API_BASE_URL repository variable is set)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked backend test dependencies without package scripts
        run: npm ci --prefix web --omit=dev --ignore-scripts
      - name: Check authentication, roster, data permissions and frontend behavior
        run: node --test scripts/*.test.mjs deploy/*.test.mjs web/test/*.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public frontend only
        env:
          ASSIGNMENT_API_BASE_URL: ${{ inputs.api_base_url || vars.ASSIGNMENT_API_BASE_URL }}
          ASSIGNMENT_AUTH_REALM: ${{ vars.ASSIGNMENT_AUTH_REALM }}
        run: node scripts/build-pages.mjs
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
